[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraping-project"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "playwright==1.60.0",
    "requests==2.34.2",
]